# Конфигурация nginx для доступа из Интернета (домашний ПК, Docker).
# Топология: браузер -> nginx (:80/:443) -> backend:8000 (API) / статика dist.
# Сервис `nginx` в docker-compose.yml монтирует этот файл как default.conf,
# а также каталоги: ./frontend/dist (статику), ./deploy/certs (сертификаты),
# ./deploy/certbot-webroot (ACME-проверка Let's Encrypt).
#
# Внешние порты (на роутере):
#   8090 -> 192.168.50.101:80   (Townhouse по HTTP, тест)
#   8443 -> 192.168.50.101:443  (Townhouse по HTTPS)
#   80/443 -> NAS: портал Synology (в этот контейнер НЕ попадают)

# ---- HTTP: SPA + API + ACME-каталог (используется и как резерв) ----
server {
    listen 80;
    listen [::]:80;
    server_name sagacloud.synology.me;

    # Каталог ACME-проверки Let's Encrypt (для выпуска/продления сертификата).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Прокси на API (FastAPI). ВАЖНО: сохраняем /api/ (без переписывания пути).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-статика (production-сборка фронтенда из frontend/dist)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}

# ---- HTTPS (порт 443; снаружи доступен как https://sagacloud.synology.me:8443) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sagacloud.synology.me;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
