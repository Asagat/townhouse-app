# Конфигурация nginx для доступа из Интернета (домашний ПК, Docker).
# Топология: браузер -> nginx (:80) -> backend:8000 (API) / статика dist.
# Сервис `nginx` в docker-compose.yml монтирует этот файл как default.conf,
# а также каталог ./frontend/dist (статику).
#
# Внешние порты (на роутере):
#   8090 -> 192.168.50.101:80   (Townhouse по HTTP)
#
# HTTPS при необходимости терминируется на NAS Synology (сертификат DSM):
# в DSM «Обратный прокси» — источник HTTPS на домен -> http://192.168.50.101:80.
# Отдельного сертификата на ПК нет, nginx слушает только HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name sagacloud.synology.me;

    # Прокси на API (FastAPI). ВАЖНО: сохраняем /api/ (без переписывания пути).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-статика (production-сборка фронтенда из frontend/dist)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
