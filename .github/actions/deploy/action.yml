name: Deploy over SSH
description: >
  Проверяет, что для выкатываемого коммита есть успешный прогон CI (ci.yml),
  и выполняет на сервере scripts/deploy_vps.sh для указанного ref.

inputs:
  ssh_host:
    description: Хост (домен/IP) сервера
    required: true
  ssh_user:
    description: Пользователь SSH (обычно root)
    required: true
  ssh_key:
    description: Приватный SSH-ключ (deploy key) в формате OpenSSH
    required: true
  app_dir:
    description: Каталог проекта на сервере (например /opt/townhouse)
    required: false
    default: /opt/townhouse
  ref:
    description: Ветка, тег или SHA для выката (по умолчанию main)
    required: false
    default: main
  allow_untested:
    description: true — разрешить деплой без успешного прогона CI (для экспериментов на staging)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate ref
      shell: bash
      run: |
        ref="${{ inputs.ref }}"
        if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
          echo "::error::Недопустимое значение ref: ${ref}" >&2
          exit 1
        fi

    - name: Checkout ${{ inputs.ref }}
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Resolve commit SHA
      id: sha
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Require green CI run for the commit
      uses: actions/github-script@v7
      env:
        SHA: ${{ steps.sha.outputs.sha }}
        ALLOW_UNTESTED: ${{ inputs.allow_untested }}
      with:
        script: |
          const sha = process.env.SHA;
          const allowUntested = process.env.ALLOW_UNTESTED === "true";
          const { data } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head_sha: sha,
            per_page: 30,
          });
          const runs = data.workflow_runs.filter((r) => r.path === ".github/workflows/ci.yml");
          const ok = runs.find((r) => r.conclusion === "success");
          if (ok) {
            console.log(`CI для ${sha.slice(0, 12)} зелёный (run #${ok.id}) — деплой разрешён.`);
            return;
          }
          const bad = runs.find((r) =>
            ["failure", "timed_out", "action_required"].includes(r.conclusion)
          );
          if (bad) {
            core.setFailed(`CI для ${sha.slice(0, 12)} завершился неудачей (run #${bad.id}) — деплой заблокирован.`);
            return;
          }
          const running = runs.find((r) => r.status === "in_progress" || r.status === "queued");
          if (running) {
            core.setFailed(`CI для ${sha.slice(0, 12)} ещё выполняется (run #${running.id}). Дождитесь завершения и повторите деплой.`);
            return;
          }
          if (!allowUntested) {
            core.setFailed(`Для ${sha.slice(0, 12)} нет успешного прогона CI — деплой заблокирован. Выберите проверенный коммит.`);
            return;
          }
          console.log(`Для ${sha.slice(0, 12)} нет прогона CI, но allow_untested=true — деплой продолжается.`);

    - name: Prepare SSH key
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Run scripts/deploy_vps.sh on the server
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        APP_DIR: ${{ inputs.app_dir }}
      # Выкатываем не имя ветки/тега, а РЕЗОЛЬВНУТЫЙ SHA проверенного CI коммита:
      # сервер всегда получает ровно то состояние, для которого CI был зелёный
      # (git pull «наугад» в момент деплоя мог бы утянуть непроверенный коммит).
      run: |
        deploy_sha="$(git rev-parse HEAD)"
        ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${APP_DIR}' && git fetch --prune origin --tags && bash scripts/deploy_vps.sh '${deploy_sha}'"
