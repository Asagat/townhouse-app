name: Docker images

# Авто-сборка docker-образов и публикация в GitHub Container Registry (ghcr.io).
# См. ROADMAP п. 3.3.
#
# ВАЖНО: для фронтенда публикуется ПРОД-образ (frontend/Dockerfile.prod — nginx +
# собранный dist), а НЕ dev-Dockerfile (Vite-сервер). Именно эти образы потребляет
# прод-стек NAS Synology (docker-compose.prod.yml, порт 80).
#
# Когда запускается:
#   - push в main      → образы с тегом main (актуальное состояние ветки);
#   - релизный тег v*  → образы с semver-тегами ({{version}}, {{major}}.{{minor}});
#   - вручную (workflow_dispatch).
#
# Образы нужны для docker-compose-установок (прод-стек NAS и домашние ПК).
# Распространение между рабочими машинами — через дампы БД (см. DEPLOY.md §8).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
          # Прод-образ фронтенда (multi-stage → nginx). НЕ frontend/Dockerfile:
          # тот собирает dev-сервер Vite и на проде не работает (ждёт порт 80/nginx).
          - service: frontend
            dockerfile: frontend/Dockerfile.prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/townhouse-app-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
