name: CI

# Автопроверка кода при каждом push/PR в main (см. ROADMAP п. 3.3):
#   - backend: pytest против disposable PostgreSQL 16 (alembic upgrade head → init_data → pytest);
#   - frontend: npm ci → npm run build (= tsc + vite build).
# Ветка main защищена (branch protection) — эти job'ы отмечаются как required checks,
# поэтому в main не попадает код, не прошедший проверки.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest на PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      # Отдельная disposable-БД для тестов (никак не связана с живыми dev/prod-данными).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: townhouse_ci
          POSTGRES_PASSWORD: townhouse_ci
          POSTGRES_DB: townhouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U townhouse_ci -d townhouse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Строку подключения собирает database.build_database_url() из DATABASE_URL.
      DATABASE_URL: postgresql://townhouse_ci:townhouse_ci@localhost:5432/townhouse_ci
      # CI-секрет для подписи JWT (в проде — свой, из .env сервера).
      AUTH_SECRET_KEY: ci-only-insecure-secret-change-me
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Seed system dictionaries (init_data.py)
        # Типы тарифов и системные справочники — их существование предполагают
        # HTTP-тесты прав доступа (например, tariff_types «зашиты» для всех ролей).
        run: python init_data.py

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend · npm ci + build (tsc + vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Ensure frontend/.env (из .env.example)
        # Тот же шаг, что predev делает локально, — детерминированная сборка.
        run: npm run ensure-env

      - name: Build (tsc + vite build)
        run: npm run build
