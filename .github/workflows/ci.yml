name: CI

# Автопроверка кода при каждом push/PR в main (см. ROADMAP п. 3.3):
#   - backend: pytest против disposable PostgreSQL 16 (alembic upgrade head → init_data → pytest);
#   - frontend: npm ci → npm run build (= tsc + vite build);
#   - images: сборка ПРОД-образов из Dockerfile.prod / Dockerfile (без публикации).
# Ветка main защищена (branch protection) — эти job'ы отмечаются как required checks,
# поэтому в main не попадает код, не прошедший проверки.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest на PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      # Отдельная disposable-БД для тестов (никак не связана с живыми dev/prod-данными).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: townhouse_ci
          POSTGRES_PASSWORD: townhouse_ci
          POSTGRES_DB: townhouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U townhouse_ci -d townhouse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Строку подключения собирает database.build_database_url() из DATABASE_URL.
      DATABASE_URL: postgresql://townhouse_ci:townhouse_ci@localhost:5432/townhouse_ci
      # CI-секрет для подписи JWT (в проде — свой, из .env сервера).
      AUTH_SECRET_KEY: ci-only-insecure-secret-change-me
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (alembic upgrade head)
        run: alembic upgrade head

      - name: Seed system dictionaries (init_data.py)
        # Типы тарифов и системные справочники — их существование предполагают
        # HTTP-тесты прав доступа (например, tariff_types «зашиты» для всех ролей).
        run: python init_data.py

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend · npm ci + build (tsc + vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Ensure frontend/.env (из .env.example)
        # Тот же шаг, что predev делает локально, — детерминированная сборка.
        run: npm run ensure-env

      - name: Build (tsc + vite build)
        run: npm run build

  # Сборка ПРОД-образов. Отдельный job нужен потому, что npm run build выше идёт
  # НА ХОСТЕ (node) и не проверяет Dockerfile: ранее прод-образ фронтенда не собирался
  # из-за прав /app при USER node, а fix этого не ловил. Образы только собираются
  # (push: false) — публикация остаётся за docker-build.yml.
  # ВНИМАНИЕ: имя МАТРИЧНОГО job'а GitHub дополняет суффиксом «(значения матрицы)»
  # (напр. «... (frontend, frontend/Dockerfile.prod)»), поэтому сам он required-чеком
  # в branch protection стать НЕ может — записанное базовое имя «висит» вечно expected
  # и не выполняется никогда. Поэтому required-чеком делаем сводный нематричный
  # job `images` ниже (needs: images-build) с фиксированным именем.
  images-build:
    name: Images · сборка (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: frontend/Dockerfile.prod
          - service: backend
            dockerfile: backend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-тест: контейнер должен РЕАЛЬНО стартовать и отдавать SPA.
      # Ловит класс ошибок «образ собрался, но падает при запуске» (например,
      # nginx: «host not found in upstream backend» без рантайм-resolver).
      - name: Smoke test frontend container
        if: matrix.service == 'frontend'
        run: |
          docker build -f frontend/Dockerfile.prod -t townhouse-fe-ci frontend
          docker run -d --name th-fe-ci -p 8080:80 townhouse-fe-ci
          # Дать nginx подняться, затем проверить отдачу статики.
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          echo '-- / :'      && curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/
          echo '-- deep route:' && curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/dashboard
          # Контейнер обязан быть running (не рестарт-луп).
          test "$(docker inspect -f '{{.State.Running}}' th-fe-ci)" = "true"
          docker logs th-fe-ci 2>&1 | tail -20

  # Сводный job с ФИКСИРОВАННЫМ именем — это и есть required check
  # «Images · сборка прод-образов (без публикации)» в branch protection.
  # always(): job обязан отработать и упасть, если любая сборка/смоук упали
  # (у skipped-чека branch protection статус «не пройден»).
  images:
    name: Images · сборка прод-образов (без публикации)
    runs-on: ubuntu-latest
    needs: [images-build]
    if: always()
    steps:
      - name: Проверить результат сборки образов
        run: |
          echo "images-build: ${{ needs.images-build.result }}"
          test "${{ needs.images-build.result }}" = "success"
