name: Deploy

# Выкат на сервер (см. ROADMAP п. 3.3 и DEPLOY.md §10).
#
# Запускается:
#   1. Вручную (workflow_dispatch): выбирается окружение (staging — тестовый сервер /
#      production) и ref (ветка/тег/SHA). Код выкатывается ТОЛЬКО после успешного CI.
#   2. Автоматически по релизному тегу v* → production (после успешного CI для тега).
#
# На сервере выполняется scripts/deploy_vps.sh:
#   git fetch + фиксация ref → alembic upgrade head → init_data → create_user
#   → сборка фронтенда (npm ci/npm run build, статика в frontend/dist)
#   → перезапуск systemd-сервиса townhouse-backend.
#
# Секреты берутся из окружений GitHub (staging / production), см. DEPLOY.md §10:
#   SSH_HOST, SSH_USER, SSH_KEY, APP_DIR.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Куда выкатывать
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      ref:
        description: Ветка, тег или SHA (по умолчанию main)
        required: false
        default: main
        type: string
      allow_untested:
        description: Разрешить деплой БЕЗ успешного CI (только для отладки на staging)
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging (тестовый сервер)
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          app_dir: ${{ secrets.APP_DIR || '/opt/townhouse' }}
          ref: ${{ inputs.ref }}
          allow_untested: ${{ inputs.allow_untested }}

  production:
    name: Production
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_key: ${{ secrets.SSH_KEY }}
          app_dir: ${{ secrets.APP_DIR || '/opt/townhouse' }}
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
