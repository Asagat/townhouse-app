# nginx-конфигурация контейнера фронтенда (production, docker-compose.prod.yml).
#
# Топология: Synology DSM «Обратный прокси» (HTTPS, сертификат DSM)
#            → fth.sagacloud.synology.me
#            → контейнер frontend:80
#              → /            статика SPA (frontend/dist в образе)
#              → /api/        proxy_pass http://backend:8000 (docker DNS)
#
# ВАЖНО: proxy_pass БЕЗ завершающего слэша — иначе nginx срежет префикс /api/,
# а бэкенд ожидает его (APIRouter(prefix="/api")).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker DNS: резолв имени сервиса backend в РАНТАЙМЕ, а не при старте nginx.
    # Иначе контейнер падает «host not found in upstream backend», если backend
    # ещё не поднялся (рестарт-луп и нерабочий healthcheck). 127.0.0.11 — встроенный
    # resolver Docker; valid=10s перечитывает адрес без перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Сжатие статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 50m;

    # API (FastAPI). Префикс /api/ сохраняется как есть.
    # proxy_pass через переменную — чтобы имя backend резолвилось рантайм-resolver-ом
    # (см. resolver выше). При этом URI не переписывается: $request_uri отдаётся как есть.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Synology Reverse Proxy терминирует HTTPS — бэкенду сообщаем исходную схему.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        # PDF (квитанции/выписки) и ZIP собираются на лету — таймаут выше обычного.
        proxy_send_timeout 300s;
    }

    # SPA-статика: любой неизвестный путь отдаёт index.html (клиентский роутинг).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Хэшированные ассеты Vite — кэшируем надолго.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html не кэшируем — иначе после обновления контейнера браузер
    # остаётся на старой версии фронтенда.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
