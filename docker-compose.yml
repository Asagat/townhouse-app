services:
  postgres:
    image: postgres:16-alpine
    container_name: townhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-townhouse_user}
      # Пароль только из .env (без дефолта-секрета в git).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?...POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:-townhouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U townhouse_user -d townhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: townhouse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-townhouse_user}:${POSTGRES_PASSWORD:?...POSTGRES_PASSWORD не задан в .env}@postgres:5432/${POSTGRES_DB:-townhouse}
      # Секрет JWT берём из корневого .env (AUTH_SECRET_KEY); dev-значение — только запасной вариант.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-dev-only-insecure-secret-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Пароль админа для авто-догона create_user.py — из .env (как и пароль БД).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?...ADMIN_PASSWORD не задан в .env}
    volumes:
      - ./backend:/app:z
    # Dev-стек (том ./backend смонтирован): авто-перезагрузка uvicorn, чтобы правки
    # кода сразу были активны без ручного restart контейнера. Прод — systemd-юнит
    # без --reload (см. DEPLOY §5), этот compose для прод-длительного не используется.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: townhouse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_DEV_HOST=localhost
      - VITE_DEV_PORT=5173
      # Прокси /api внутри контейнера должен ходить на сервис backend (Docker DNS),
      # а не на localhost (иначе в браузере запросы к API не доходят до бэкенда).
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app:z
      - /app/node_modules

  # Внешний вход (Интернет): статика production-сборки + прокси /api на backend.
  # Снаружи открывается ТОЛЬКО порт 80 (не 5173/8000/5432). HTTPS при
  # необходимости терминируется на NAS Synology, на ПК сертификата нет.
  nginx:
    image: nginx:alpine
    container_name: townhouse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-home.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./frontend/dist:/usr/share/nginx/html:ro,z
    depends_on:
      - backend

volumes:
  pgdata:
