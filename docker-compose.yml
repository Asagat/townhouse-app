services:
  # ----- PostgreSQL (ОПЦИОНАЛЬНО, для локальной разработки) -----
  # Раскомментируйте, чтобы docker compose поднял и БД из POSTGRES_* (.env).
  # Использует обычную сеть (НЕ host), поэтому порт 5432 берётся с localhost.
  # На VPS, где Postgres внешний (host-сеть), этот сервис не нужен — оставьте
  # закомментированным.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: townhouse-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-townhouse}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      network: host
    container_name: townhouse-backend
    network_mode: host
    volumes:
      - ./backend:/app:z
    env_file: .env
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    security_opt:
      - "apparmor:unconfined"

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: townhouse-frontend
    network_mode: host
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - VITE_API_URL=http://townhouse.sagacloud.kz/api
      - CHOKIDAR_USEPOLLING=true
    security_opt:
      - "apparmor:unconfined"

volumes:
  pgdata:
