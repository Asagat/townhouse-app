services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: townhouse-backend
    network_mode: host
    volumes:
      - ./backend:/app:z
    env_file: .env
    # В network_mode: host порты пробрасывать не нужно, они откроются на IP LXC
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    security_opt:
      - "apparmor:unconfined"

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: townhouse-frontend
    network_mode: host
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    security_opt:
      - "apparmor:unconfined"
